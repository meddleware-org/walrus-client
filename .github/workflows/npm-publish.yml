name: Publish (npm)

# Publishes the package to npmjs on a v* tag. Publication is gated on a
# self-contained `verify` job (type-check + test + build) that re-runs the
# checks against the exact tagged commit, so a broken tag never ships.
# Authentication uses npm OIDC trusted publishing — no long-lived NPM_TOKEN.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify (type-check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Type-check
        run: npm run type-check --if-present
      - name: Unit tests
        run: npm run test --if-present
      - name: Build
        run: npm run build --if-present

  publish-npm:
    name: npmjs (@meddleware/walrus-client)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 24 ships an older npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Publish to npmjs (OIDC, idempotent)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@meddleware/walrus-client@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::v${VERSION} already published to npmjs — skipping."
          else
            npm publish --access public
          fi
