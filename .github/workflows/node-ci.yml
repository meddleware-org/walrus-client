name: Node CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Type-check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
      - name: Dependency tree is valid (peer ranges satisfied)
        run: npm ls --all >/dev/null

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Lint JS (eslint)
        run: npm run lint:js

      - name: Test
        run: npm test

      - name: Build (declarations)
        run: npm run build

  shellcheck:
    name: shellcheck (localnet harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck is preinstalled on the GitHub-hosted Ubuntu runners.
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR localnet/scripts/*.sh localnet/files/*.sh
