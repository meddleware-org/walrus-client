name: Integration (localnet)

# Opt-in, heavy localnet e2e — kept off the PR path so normal CI stays fast. Runs on demand and
# nightly. A red scheduled run opens (or refreshes) a GitHub issue, and the publish workflow refuses a
# tag while the latest run is red (.github/localnet-gate.mjs). Brings up the Docker-Compose Walrus testbed (localnet/) and runs the real blob-lifecycle
# suite against it. See localnet/README.md.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly

permissions:
  contents: read

jobs:
  localnet:
    name: walrus-client localnet suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout walrus-client (into repos/walrus-client)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repos/walrus-client

      - name: Checkout access-gate-sui (sibling, for the localnet gate deploy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: meddleware-org/access-gate-sui
          # The commit of the access-gate-sui v0.0.6 tag (a SHA, not a moving ref); the ACCESS_GATE_REF
          # repository variable overrides it to test another access_gate.
          ref: ${{ vars.ACCESS_GATE_REF || '83dbf25f026aa4be78ad6ec7cae47221c0743bf0' }}
          path: repos/access-gate-sui

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install sui CLI (suiup)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSLo /tmp/suiup.tgz "https://github.com/MystenLabs/suiup/releases/download/v0.0.14/suiup-Linux-musl-x86_64.tar.gz"
          echo "c0b9fea95d52c4c5855478c3ee56e58e446614f32300dbd41fcc637a2e09878a  /tmp/suiup.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/suiup.tgz -C "$HOME/.local/bin" suiup
          "$HOME/.local/bin/suiup" install sui@testnet-v1.81.0 --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The release asset suiup downloads is not checksum-verified by suiup itself: pin the binary (the
          # same one the Move packages' CI pins, and the toolchain their Published.toml names).
          "$HOME/.local/bin/sui" --version
          echo "c86c0481a44174dfa17af89e71292d6fba5df267c66722ae6797e8793a22f7f1  $HOME/.local/bin/sui" | sha256sum -c -
          # localnet env creation is deferred to bootstrap-localnet.sh (runs after the testbed is up)

      - name: Bring up the localnet testbed
        working-directory: repos/walrus-client/localnet
        run: bash scripts/up.sh

      - name: Bootstrap localnet (deploy + harvest + .env.localnet)
        working-directory: repos/walrus-client/localnet
        run: bash scripts/bootstrap-localnet.sh

      - name: Install deps
        working-directory: repos/walrus-client
        run: npm ci

      - name: Run localnet integration suite
        working-directory: repos/walrus-client
        run: |
          set -a && source localnet/.env.localnet && set +a
          npm run test:integration

      - name: Tear down
        if: always()
        working-directory: repos/walrus-client/localnet
        run: bash scripts/down.sh || true

  # A red nightly used to go unnoticed (0.0.26 shipped while the suite was red). On a scheduled run,
  # open one issue per red streak and comment on it each further night; close it when the suite
  # passes again. A manual (workflow_dispatch) run is watched by whoever started it.
  alert:
    name: Alert on a red nightly
    needs: localnet
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.localnet.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Nightly localnet suite is red
    steps:
      - name: Open, refresh or close the issue
        run: |
          # A cancelled run says nothing about the code; leave the issue as it is.
          case "$RESULT" in success|failure) ;; *) echo "result '$RESULT': nothing to do"; exit 0 ;; esac
          OPEN=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ "$RESULT" = "success" ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --comment "The nightly localnet suite passed again: $RUN_URL"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Still $RESULT: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled localnet integration suite finished with: $RESULT.

          Run: $RUN_URL

          The publish workflow refuses a release tag while the latest run is red (.github/localnet-gate.mjs). Fix the failure, then dispatch \"Integration (localnet)\" on main."
          fi
