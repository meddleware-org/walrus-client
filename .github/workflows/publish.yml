name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm (@meddleware/walrus-client)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Publish to npmjs (provenance via OIDC, idempotent)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Use `npm view` (registry API) rather than curl (CDN) to avoid propagation-lag false
          # negatives: shortly after a manual publish the CDN can still 404 the version, which made
          # this fall through to `npm publish` and fail with the misleading E404/"no permission"
          # (npm's response when publishing over an existing version).
          if npm view "@meddleware/walrus-client@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::v${VERSION} already published to npmjs — skipping"
          else
            npm publish --provenance
          fi
