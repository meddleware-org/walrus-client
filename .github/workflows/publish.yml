name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to npm (@meddleware/walrus-client)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Publish to npmjs (provenance via OIDC, idempotent)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG="@meddleware/walrus-client@${VERSION}"
          # Pre-check via `npm view` (registry API, not CDN). But even the registry read path lags a
          # manual publish by a few seconds, so when a tag-triggered run races a just-published
          # version this can miss and fall through to `npm publish`, which then 404s ("no permission"
          # — npm's response to publishing over an existing version). So also tolerate that race:
          # after a failed publish, re-check and treat "version now present" as success.
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "::notice::v${VERSION} already published to npmjs — skipping"
          elif npm publish --provenance; then
            echo "::notice::published v${VERSION}"
          elif npm view "$PKG" version >/dev/null 2>&1; then
            echo "::notice::v${VERSION} already present (publish raced a prior publish) — treating as success"
          else
            echo "::error::publish failed and v${VERSION} is not on the registry"
            exit 1
          fi
